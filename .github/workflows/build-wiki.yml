name: Build wiki
# When content/ or src/ changes on main, rebuild index.html so the live page always matches the content.
on:
  push:
    branches: [main]
    paths: ["content/**", "src/**", "tools/build.py", "wiki-docs/todoist-sync-index.json"]
permissions:
  contents: write
concurrency: build-wiki
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: python3 tools/build.py
      - name: Commit rebuilt index.html
        run: |
          if ! git diff --quiet -- index.html; then
            git config user.name "wiki-build"
            git config user.email "wiki-build@users.noreply.github.com"
            git add index.html
            git commit -m "Rebuild index.html from content"
            git push
          fi
